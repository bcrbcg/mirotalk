name: Build Mobile App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Re-create Android Project
        run: |
          cd mobile_app
          rm -rf android
          flutter create . --org com.mirotalk.app --platforms android

      - name: Fix Min SDK Version
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' mobile_app/android/app/build.gradle

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mirotalk-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
